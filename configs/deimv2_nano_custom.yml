# DEIMv2 Nano (HGNetv2-B0) — fine-tune trên dataset COCO-format tùy chỉnh.
# Các giá trị dataset / epochs / batch / lr được train.py ghi đè qua CLI.
__include__: [
  './dataset/custom_detection.yml',
  './runtime.yml',
  './base/dataloader.yml',
  './base/optimizer.yml',
  './base/deimv2.yml'
]

output_dir: ./outputs/deimv2_nano_custom

# Trọng số đầy đủ đã nạp từ checkpoint/pretrained/deimv2_hgnetv2_n_coco.pth
# nên không cần tải thêm weight backbone HGNetv2 riêng.
HGNetv2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: False

HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]

  # intra
  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512

  # cross
  expansion: 0.34
  depth_mult: 0.5

  version: 'dfine'

DEIMTransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  num_levels: 2
  num_points: [6, 6]

  num_layers: 3
  eval_idx: -1

  # FFN
  dim_feedforward: 512

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 100
flat_epoch: 7800    # giữ LR phẳng như cấu hình Nano gốc
no_aug_epoch: 10
lr_gamma: 1.0

print_freq: 50
checkpoint_freq: 10

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 48, 90]

  collate_fn:
    ema_restart_decay: 0.9999
    base_size_repeat: ~
    mixup_epochs: [4, 48]
    stop_epoch: 90
    copyblend_prob: 0.4
    copyblend_epochs: [4, 48]
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

DEIMCriterion:
  matcher:
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 80
